<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Agendia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --agendia-primary: #6C5CE7;
            --agendia-primary-dark: #5849C2;
            --agendia-bg: #F7F7FC;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--agendia-bg);
        }
        .navbar-agendia {
            background: linear-gradient(90deg, var(--agendia-primary), var(--agendia-primary-dark));
        }
        .navbar-agendia .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .btn-primary {
            background-color: var(--agendia-primary);
            border-color: var(--agendia-primary);
        }
        .btn-primary:hover {
            background-color: var(--agendia-primary-dark);
            border-color: var(--agendia-primary-dark);
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .badge {
            font-weight: 500;
            padding: 0.5em 0.8em;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-agendia mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-calendar-check-fill me-2"></i>Agendia
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
